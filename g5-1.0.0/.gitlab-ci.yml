image: python:3.12-slim

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/

before_script:
  - pip install -r requirements.txt
  - pip install pytest ruff httpx

lint:
  stage: lint
  script:
    - ruff check .
    - ruff format --check .
  allow_failure: true

test:
  stage: test
  script:
    - pytest ./tests/ -v --junitxml=report.xml --tb=short
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml
    expire_in: 30 days
